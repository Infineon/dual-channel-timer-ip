  - src/tc_soc_timer_cACTVALControlUnit.sv
  - src/tc_soc_timer_cBitSynchronizer.sv
  - src/tc_soc_timer_cComparator.sv
  - src/tc_soc_timer_cInterruptControlUnit.sv

  # Level 1
  - src/tc_soc_timer_Reg_IF_AHB_RAI_Bridge_bridge_fsm.sv
